name: 新增或修改数据源
description: 提议增加单个视频、视频合集或修正现有来源
title: "[Source] "
labels: ["data-source"]
body:
  - type: dropdown
    id: kind
    attributes:
      label: 来源类型
      options:
        - video_collection
        - single_video
    validations:
      required: true
  - type: input
    id: creator
    attributes:
      label: 博主名称
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: B站链接
      placeholder: https://www.bilibili.com/video/BV.../
    validations:
      required: true
  - type: textarea
    id: reason
    attributes:
      label: 说明
      description: 请说明该来源与炉石卡组检索的关系，以及是否持续更新。
    validations:
      required: true
